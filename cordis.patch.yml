# dsh-compaction-jev bundle patch: mount this package's root plugin, which owns
# the settings namespace every Jev value lives in.
#
# The row names the PACKAGE ROOT, not a subpath, and that is load-bearing. The
# Web client table maps loader entries to packages by module specifier and treats
# a subpath entry as permanently not a client row, so a `dsh-compaction-jev/...`
# row would mount the host half while leaving the Settings page undiscoverable.
#
# The compaction backend is NOT wired here, and that too is deliberate. A Web
# deployment composes compaction inside an agent preset's isolated group and the
# shipped `dsh-web-app` layer disables the host-plane backend row, so adding a
# host-plane backend row here would populate a service the profile suppressed.
# The wiring point for a Web deployment is a user-owned preset copy, which mounts
# `dsh-compaction-jev/engine`; see README.md and preset/compaction-jev.rows.yml.
#
# This row only registers the settings namespace, which the backend reads through
# the host's single settings provider. `enabled` defaults to false, so mounting
# this patch changes no compaction behavior until a user turns Jev on in
# Settings.
#
# Install with:
#
#   dsh plugin --profile <name> add <path-to-this-package>

- insert:
    - id: compaction-jev-settings
      name: 'dsh-compaction-jev'