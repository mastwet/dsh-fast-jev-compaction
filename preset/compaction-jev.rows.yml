# The compaction rows for a user-owned agent preset, for a Web deployment whose
# compaction backend lives inside the preset's isolated group.
#
# Presets are copy-only: there is no patch layer that expresses "the standard
# preset plus one change". Author a preset copy, then replace its `compaction`
# group's rows with these. The rest of the copied composition is unchanged.
#
#   dsh> ctx.agentPresets.copy('standard', 'jev')   # or copy the directory by hand
#   # edit <the copy>/agent.cordis.yml
#
# Everything before the group row is the shipped assembly; only the two backend
# rows inside it change.
#
# The backend row carries NO Jev configuration and names the package's `engine`
# entry, not the package root: the root is the plugin that registers the
# `dsh-compaction-jev` settings namespace, so mounting it here would register
# that namespace twice. Every value that decides how Jev behaves — including
# whether it runs at all — lives in the namespace, so one place holds each value
# and a change applies without a restart. `enabled` defaults to false: point a
# preset at this row and the sessions using it still compact with the built-in
# summary until Jev is turned on in Settings (or in `settings.yaml`).
#
# A preset lives outside the profile plane and resolves no bare package name.
# There, address the entry by absolute URL instead:
#
#   file:///<profile>/node_modules/dsh-compaction-jev/lib/engine.js

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-jev
      name: 'dsh-compaction-jev/engine'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024